openapi: 3.0.3

info:
  title: Do Campo à Mesa API
  version: 1.0.0
  description: >
    API REST da plataforma Do Campo à Mesa, que liga produtores locais
    a consumidores e estabelecimentos, incluindo encomendas, avaliações
    e leilões.

servers:
  - url: https://do-campo-a-mesa-api.onrender.com/api
    description: Produção (Render)
  - url: http://localhost:3000/api
    description: Ambiente local

security: []

tags:
  - name: Autenticação
  - name: Produtos
  - name: Produtores
  - name: Encomendas
  - name: Leilões
  - name: Avaliações
  - name: Administração
  - name: Sistema

paths:
  /producers:
    get:
      tags: [Produtores]
      summary: Listar produtores validados
      parameters:
        - name: localidade
          in: query
          description: Filtrar produtores por localidade
          schema:
            type: string
      responses:
        '200':
          description: Lista de produtores validados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Producer'

  /producers/me:
    patch:
      tags: [Produtores]
      summary: Atualizar o perfil da própria exploração
      description: >
        Permite a um produtor autenticado editar o nome
        e a descrição da sua exploração. A localização
        e o estado de validação não podem ser alterados
        através deste endpoint.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nomeExploracao, descricao]
              properties:
                nomeExploracao:
                  type: string
                  minLength: 1
                  maxLength: 100
                  example: Horta da Ribeira
                descricao:
                  type: string
                  maxLength: 1000
                  example: Exploração familiar em Ponte de Lima.
      responses:
        '200':
          description: Perfil atualizado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  nomeExploracao:
                    type: string
                  descricao:
                    type: string
        '400':
          $ref: '#/components/responses/Erro'
        '401':
          $ref: '#/components/responses/Erro'
        '403':
          $ref: '#/components/responses/Erro'
        '404':
          $ref: '#/components/responses/Erro'

  /producers/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Produtores]
      summary: Obter página pública de um produtor
      responses:
        '200':
          description: Dados públicos do produtor, produtos e avaliação média
          content:
            application/json:
              schema:
                type: object
                properties:
                  produtor:
                    $ref: '#/components/schemas/Producer'
                  produtos:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  avaliacaoMedia:
                    type: number
                    nullable: true
                    description: >
                      Média das avaliações visíveis atribuídas ao produtor,
                      excluindo as avaliações individuais dos produtos.
                    example: 4.0

                  totalAvaliacoes:
                    type: integer
                    minimum: 0
                    description: >
                      Número de avaliações visíveis do produtor,
                      excluindo as avaliações individuais dos produtos.
                    example: 2

        '400':
          $ref: '#/components/responses/Erro'
        '404':
          $ref: '#/components/responses/Erro'

  /products:
    get:
      tags: [Produtos]
      summary: Pesquisar produtos
      parameters:
        - name: q
          in: query
          description: Texto a pesquisar no nome do produto, no nome do produtor ou no nome da exploração
          schema:
            type: string
        - name: categoria
          in: query
          schema:
            $ref: '#/components/schemas/Categoria'
        - name: precoMax
          in: query
          description: Preço máximo
          schema:
            type: number
            minimum: 0
        - name: bio
          in: query
          description: Filtrar apenas produtos biológicos
          schema:
            type: boolean
        - name: epoca
          in: query
          description: Época do ano
          schema:
            type: string
            enum: [Primavera, Verão, Outono, Inverno]
        - name: produtor
          in: query
          description: Identificador do produtor
          schema:
            type: string
        - name: ordenar
          in: query
          description: Ordenação dos resultados
          schema:
            type: string
            enum: [recentes, preco_asc, preco_desc]
      responses:
        '200':
          description: Lista de produtos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'

    post:
      tags: [Produtos]
      summary: Criar produto
      description: Requer um produtor autenticado e validado.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Produto criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/Erro'
        '401':
          $ref: '#/components/responses/Erro'
        '403':
          $ref: '#/components/responses/Erro'

  /products/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'

    get:
      tags: [Produtos]
      summary: Obter detalhe de um produto
      responses:
        '200':
          description: Produto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/Erro'
        '404':
          $ref: '#/components/responses/Erro'

    put:
      tags: [Produtos]
      summary: Atualizar produto
      description: Apenas o produtor proprietário do produto.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdate'
      responses:
        '200':
          description: Produto atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/Erro'
        '401':
          $ref: '#/components/responses/Erro'
        '403':
          $ref: '#/components/responses/Erro'
        '404':
          $ref: '#/components/responses/Erro'

    delete:
      tags: [Produtos]
      summary: Remover produto
      description: Apenas o produtor proprietário do produto.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Produto removido
        '400':
          $ref: '#/components/responses/Erro'
        '401':
          $ref: '#/components/responses/Erro'
        '403':
          $ref: '#/components/responses/Erro'
        '404':
          $ref: '#/components/responses/Erro'

  /orders:
    post:
      tags: [Encomendas]
      summary: Criar encomenda
      description: >
        Cria uma ou mais encomendas, agrupando os produtos por produtor
        e reservando o stock de forma atómica.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderInput'
      responses:
        '201':
          description: Encomendas criadas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/Erro'
        '401':
          $ref: '#/components/responses/Erro'
        '403':
          $ref: '#/components/responses/Erro'
        '409':
          $ref: '#/components/responses/Erro'

    get:
      tags: [Encomendas]
      summary: Listar encomendas do utilizador autenticado
      description: >
        Um comprador vê as suas encomendas e um produtor vê as
        encomendas recebidas.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de encomendas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Erro'

  /orders/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Encomendas]
      summary: Obter detalhe de uma encomenda
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Encomenda
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/Erro'
        '401':
          $ref: '#/components/responses/Erro'
        '404':
          $ref: '#/components/responses/Erro'

  /orders/{id}/estado:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Encomendas]
      summary: Atualizar estado da encomenda
      description: >
        Apenas o produtor da encomenda pode alterar o estado.
        O estado só pode avançar.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado:
                  $ref: '#/components/schemas/OrderStatus'
      responses:
        '200':
          description: Estado atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/Erro'
        '401':
          $ref: '#/components/responses/Erro'
        '403':
          $ref: '#/components/responses/Erro'
        '404':
          $ref: '#/components/responses/Erro'
        '409':
          $ref: '#/components/responses/Erro'

  /auctions:
    get:
      tags: [Leilões]
      summary: Listar leilões
      parameters:
        - name: estado
          in: query
          description: Filtrar leilões pelo estado
          schema:
            $ref: '#/components/schemas/AuctionStatus'

      responses:
        '200':
          description: Lista de leilões
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Auction'

    post:
      tags: [Leilões]
      summary: Criar leilão
      description: Requer um produtor autenticado e validado.
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuctionInput'

      responses:
        '201':
          description: Leilão criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auction'

        '400':
          $ref: '#/components/responses/Erro'

        '401':
          $ref: '#/components/responses/Erro'

        '403':
          $ref: '#/components/responses/Erro'

  /auctions/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'

    get:
      tags: [Leilões]
      summary: Obter detalhe de um leilão

      responses:
        '200':
          description: Leilão e últimas licitações
          content:
            application/json:
              schema:
                type: object
                properties:
                  leilao:
                    $ref: '#/components/schemas/Auction'

                  licitacoes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Bid'

        '400':
          $ref: '#/components/responses/Erro'

        '404':
          $ref: '#/components/responses/Erro'

  /auctions/{id}/imagem:
    parameters:
      - $ref: '#/components/parameters/Id'

    post:
      tags: [Leilões]
      summary: Carregar fotografia de um leilão
      description: >
        Permite ao produtor responsável carregar a fotografia de um leilão ainda não
        terminado. Aceita JPEG, PNG e WebP até 5 MB.
        A fotografia é opcional na criação do leilão.
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [imagem]
              properties:
                imagem:
                  type: string
                  format: binary
                  description: Fotografia do lote

      responses:
        '200':
          description: Fotografia guardada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  imagemUrl:
                    type: string
                    description: URL da fotografia guardada
                    example: /uploads/exemplo.jpg

        '400':
          $ref: '#/components/responses/Erro'
        '401':
          $ref: '#/components/responses/Erro'
        '403':
          $ref: '#/components/responses/Erro'
        '404':
          $ref: '#/components/responses/Erro'
        '409':
          $ref: '#/components/responses/Erro'

  /auctions/{id}/bids:
    parameters:
      - $ref: '#/components/parameters/Id'

    get:
      tags: [Leilões]
      summary: Listar licitações de um leilão

      responses:
        '200':
          description: Lista de licitações
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Bid'

        '400':
          $ref: '#/components/responses/Erro'

        '404':
          $ref: '#/components/responses/Erro'

  /reviews:
    get:
      tags: [Avaliações]
      summary: Listar avaliações visíveis

      parameters:
        - name: produtor
          in: query
          description: Filtrar avaliações por produtor
          schema:
            type: string

        - name: produto
          in: query
          description: Filtrar avaliações por produto
          schema:
            type: string

      responses:
        '200':
          description: Lista de avaliações visíveis
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Review'

    post:
      tags: [Avaliações]
      summary: Avaliar um produto ou produtor
      description: >
        Apenas compradores podem avaliar produtos e produtores
        de encomendas que lhes pertencem e que estejam entregues.
        Quando o campo produto é fornecido, a avaliação refere-se
        a esse produto, que deve pertencer à encomenda.
        Quando o campo produto é omitido, a avaliação refere-se
        ao produtor da encomenda.
        É permitida uma avaliação por produto e por encomenda,
        além de uma avaliação do produtor por encomenda.
        As avaliações duplicadas são rejeitadas com HTTP 409.
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewInput'

      responses:
        '201':
          description: Avaliação criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'

        '400':
          $ref: '#/components/responses/Erro'

        '401':
          $ref: '#/components/responses/Erro'

        '403':
          $ref: '#/components/responses/Erro'

        '404':
          $ref: '#/components/responses/Erro'

        '409':
          $ref: '#/components/responses/Erro'

  /reviews/minhas:
    get:
      tags: [Avaliações]
      summary: Consultar as avaliações do comprador autenticado
      description: >
        Devolve as avaliações submetidas pelo comprador autenticado,
        incluindo avaliações de produtos e de produtores.
        As avaliações estão associadas às respetivas encomendas
        e são apresentadas por ordem decrescente de criação.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de avaliações do comprador
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Review'
        '401':
          $ref: '#/components/responses/Erro'
        '403':
          $ref: '#/components/responses/Erro'

  /reviews/{id}/denuncia:
    parameters:
      - $ref: '#/components/parameters/Id'

    post:
      tags: [Avaliações]
      summary: Denunciar avaliação
      description: >
        Permite a um utilizador autenticado denunciar uma avaliação
        pública. Cada utilizador só pode denunciar a mesma avaliação
        uma vez. A denúncia é registada através de uma operação
        atómica no MongoDB, evitando duplicações em pedidos
        simultâneos. Uma denúncia aceite devolve HTTP 204.
        Se o utilizador já tiver denunciado a avaliação ou esta
        não estiver disponível, é devolvido HTTP 409.
      security:
        - bearerAuth: []

      responses:
        '204':
          description: Avaliação denunciada

        '400':
          $ref: '#/components/responses/Erro'

        '401':
          $ref: '#/components/responses/Erro'

        '404':
          $ref: '#/components/responses/Erro'

        '409':
          $ref: '#/components/responses/Erro'

  /auth/registo:
    post:
      tags: [Autenticação]
      summary: Registar utilizador
      description: >
        Regista um comprador ou produtor. Os produtores ficam inicialmente
        por validar pelo administrador. No registo de produtores, o sistema
        tenta obter automaticamente as coordenadas aproximadas da localidade
        através do Nominatim e guardá-las no MongoDB.
        Caso o serviço de geocodificação esteja indisponível,
        o registo continua normalmente, sem coordenadas.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'

      responses:
        '201':
          description: Utilizador registado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string

        '400':
          $ref: '#/components/responses/Erro'

        '409':
          $ref: '#/components/responses/Erro'

  /auth/login:
    post:
      tags: [Autenticação]
      summary: Iniciar sessão

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'

      responses:
        '200':
          description: Sessão iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'

        '400':
          $ref: '#/components/responses/Erro'

        '401':
          $ref: '#/components/responses/Erro'

  /auth/eu:
    get:
      tags: [Autenticação]
      summary: Obter utilizador autenticado
      security:
        - bearerAuth: []

      responses:
        '200':
          description: Dados do utilizador autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

        '401':
          $ref: '#/components/responses/Erro'

  /admin/estatisticas:
    get:
      tags: [Administração]
      summary: Obter estatísticas da plataforma
      security:
        - bearerAuth: []

      responses:
        '200':
          description: Estatísticas gerais
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStats'

        '401':
          $ref: '#/components/responses/Erro'

        '403':
          $ref: '#/components/responses/Erro'

  /admin/produtores/pendentes:
    get:
      tags: [Administração]
      summary: Listar produtores pendentes de validação
      security:
        - bearerAuth: []

      responses:
        '200':
          description: Lista de produtores pendentes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

        '401':
          $ref: '#/components/responses/Erro'

        '403':
          $ref: '#/components/responses/Erro'

  /admin/produtores/{id}/validacao:
    parameters:
      - $ref: '#/components/parameters/Id'

    patch:
      tags: [Administração]
      summary: Validar ou rejeitar produtor
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [aprovado]
              properties:
                aprovado:
                  type: boolean
                  example: true

      responses:
        '200':
          description: Estado de validação atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

        '400':
          $ref: '#/components/responses/Erro'

        '401':
          $ref: '#/components/responses/Erro'

        '403':
          $ref: '#/components/responses/Erro'

        '404':
          $ref: '#/components/responses/Erro'

  /admin/reviews/denunciadas:
    get:
      tags: [Administração]
      summary: Listar avaliações denunciadas
      security:
        - bearerAuth: []

      responses:
        '200':
          description: Lista de avaliações denunciadas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Review'

        '401':
          $ref: '#/components/responses/Erro'

        '403':
          $ref: '#/components/responses/Erro'

  /admin/reviews/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'

    patch:
      tags: [Administração]
      summary: Alterar visibilidade de uma avaliação
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visivel]
              properties:
                visivel:
                  type: boolean
                  example: false

      responses:
        '200':
          description: Avaliação atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'

        '400':
          $ref: '#/components/responses/Erro'

        '401':
          $ref: '#/components/responses/Erro'

        '403':
          $ref: '#/components/responses/Erro'

        '404':
          $ref: '#/components/responses/Erro'

  /health:
    get:
      summary: Verificar estado da API
      tags: [Sistema]

      responses:
        '200':
          description: API disponível
          content:
            application/json:
              schema:
                type: object
                properties:
                  estado:
                    type: string
                    example: ok

  /products/{id}/imagem:
    parameters:
      - $ref: '#/components/parameters/Id'

    post:
      tags: [Produtos]
      summary: Carregar imagem de um produto
      description: >
        Permite ao produtor proprietário carregar ou substituir a imagem
        de um produto. São aceites imagens JPEG, PNG e WebP até 5 MB.
        O serviço utiliza Supabase Storage através da API compatível com S3
        quando configurado. Alternativamente, suporta Azure Blob Storage
        mediante configuração específica ou armazenamento local em desenvolvimento.
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [imagem]
              properties:
                imagem:
                  type: string
                  format: binary

      responses:
        '200':
          description: Imagem carregada e associada ao produto com sucesso
          content:
            application/json:
              schema:
                type: object
                required: [imagemUrl]
                properties:
                  imagemUrl:
                    type: string
                    description: Caminho local ou URL público da imagem
                    example: /uploads/1792831772759-d22a03c40595d09e37c6a077.jpg

        '400':
          $ref: '#/components/responses/Erro'

        '401':
          $ref: '#/components/responses/Erro'

        '403':
          $ref: '#/components/responses/Erro'

        '404':
          $ref: '#/components/responses/Erro'

        '413':
          description: Imagem superior ao limite de 5 MB
          content:
            application/json:
              schema:
                type: object
                properties:
                  erro:
                    type: string
                    example: A imagem não pode ultrapassar 5 MB


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        example: 66f5a1c2e4b0a1b2c3d4e5f6

  responses:
    Erro:
      description: Erro
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'

  schemas:
    Erro:
      type: object
      properties:
        erro:
          type: string
          example: Dados inválidos
        detalhes:
          type: object
          additionalProperties:
            type: string

    Categoria:
      type: string
      enum:
        - Hortícolas
        - Fruta
        - Mel
        - Vinho
        - Queijo
        - Padaria
        - Outros

    ProductInput:
      type: object
      required: [nome, categoria, preco]
      properties:
        nome:
          type: string
          example: Kiwi Hayward
        descricao:
          type: string
        categoria:
          $ref: '#/components/schemas/Categoria'
        preco:
          type: number
          minimum: 0
          example: 2.4
        unidade:
          type: string
          example: kg
        stock:
          type: integer
          minimum: 0
          example: 300
        biologico:
          type: boolean
          example: true
        epocas:
          type: array
          items:
            type: string
            enum: [Primavera, Verão, Outono, Inverno]

    ProductUpdate:
      type: object
      properties:
        nome:
          type: string
        descricao:
          type: string
        categoria:
          $ref: '#/components/schemas/Categoria'
        preco:
          type: number
          minimum: 0
        unidade:
          type: string
        stock:
          type: integer
          minimum: 0
        biologico:
          type: boolean
        epocas:
          type: array
          items:
            type: string
            enum: [Primavera, Verão, Outono, Inverno]

    Product:
      allOf:
        - $ref: '#/components/schemas/ProductInput'
        - type: object
          properties:
            _id:
              type: string
            produtor:
              oneOf:
                - type: string
                - $ref: '#/components/schemas/Producer'
              description: Identificador do produtor ou objeto populado com os seus dados
            imagemUrl:
              type: string
              nullable: true

    Producer:
      type: object
      properties:
        _id:
          type: string
        nome:
          type: string
          example: Horta da Ribeira
        produtor:
          type: object
          properties:
            nomeExploracao:
              type: string
              example: Horta da Ribeira
            descricao:
              type: string
            localidade:
              type: string
              example: Ponte de Lima
            localizacao:
              type: object
              description: >
                Coordenadas geográficas do produtor.
                Podem representar a localidade aproximada
                ou a localização da exploração.
              properties:
                lat:
                  type: number
                  format: double
                  example: 41.7467782
                lng:
                  type: number
                  format: double
                  example: -8.573465
                origem:
                  type: string
                  enum: [localidade, exploracao]
                  description: >
                    localidade indica coordenadas aproximadas.
                    exploracao indica a localização da exploração.
                  example: localidade
            validado:
              type: boolean
        createdAt:
          type: string
          format: date-time

    OrderStatus:
      type: string
      enum:
        - pendente
        - confirmada
        - pronta
        - entregue

    OrderInput:
      type: object
      required: [linhas]
      properties:
        linhas:
          type: array
          minItems: 1
          items:
            type: object
            required: [produto, quantidade]
            properties:
              produto:
                type: string
                example: 66f5a1c2e4b0a1b2c3d4e5f6
              quantidade:
                type: integer
                minimum: 1
                example: 2
        entrega:
          type: object
          properties:
            tipo:
              type: string
              enum: [levantamento, entrega]
              default: levantamento
            morada:
              type: string

    Order:
      type: object
      properties:
        _id:
          type: string
        comprador:
          oneOf:
            - type: string
            - type: object
          description: Identificador ou objeto populado do comprador
        produtor:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/Producer'
          description: Identificador ou objeto populado do produtor
        linhas:
          type: array
          items:
            type: object
            properties:
              produto:
                type: string
              nome:
                type: string
              precoUnit:
                type: number
              unidade:
                type: string
              quantidade:
                type: integer
        estado:
          $ref: '#/components/schemas/OrderStatus'
        entrega:
          type: object
          properties:
            tipo:
              type: string
              enum: [levantamento, entrega]
            morada:
              type: string
        origem:
          type: string
          enum: [loja, leilao]
        leilao:
          type: string
          nullable: true
        total:
          type: number
          description: Total calculado pelo virtual do modelo
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        entregueEm:
          type: string
          format: date-time
          nullable: true
          description: >
            Data em que a encomenda foi marcada como entregue.
            Pode ser nula em encomendas antigas ou ainda não entregues.

    AuctionStatus:
      type: string
      enum:
        - agendado
        - ativo
        - terminado

    AuctionInput:
      type: object
      required:
        - lote
        - precoBase
        - incremento
        - iniciaEm
        - duracaoMin

      properties:
        produto:
          type: string

        lote:
          type: string
          example: 200 kg de kiwi Hayward, calibre A

        quantidade:
          type: string
          example: 200 kg

        precoBase:
          type: number
          minimum: 0
          example: 200

        incremento:
          type: number
          minimum: 0.01
          example: 5

        iniciaEm:
          type: string
          format: date-time

        duracaoMin:
          type: integer
          minimum: 1
          description: Duração do leilão em minutos.
          example: 30

    Auction:
      type: object
      properties:
        _id:
          type: string

        produtor:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/Producer'

        produto:
          oneOf:
            - type: string
              nullable: true
            - $ref: '#/components/schemas/Product'

        lote:
          type: string

        descricao:
          type: string

        quantidade:
          type: string

        precoBase:
          type: number

        incremento:
          type: number

        licitacaoAtual:
          type: object
          properties:
            valor:
              type: number

            comprador:
              type: string
              nullable: true

            nome:
              type: string
              nullable: true

            em:
              type: string
              format: date-time
              nullable: true

        numLicitacoes:
          type: integer

        iniciaEm:
          type: string
          format: date-time

        terminaEm:
          type: string
          format: date-time

        estado:
          $ref: '#/components/schemas/AuctionStatus'

        encomenda:
          type: string
          nullable: true

        createdAt:
          type: string
          format: date-time

        updatedAt:
          type: string
          format: date-time

        imagemUrl:
          type: string
          nullable: true
          description: >
            Fotografia própria do leilão.
            Quando não existe, a interface pode apresentar
            a imagem do produto associado.
          example: /uploads/exemplo.jpg

    Bid:
      type: object
      properties:
        _id:
          type: string

        leilao:
          type: string

        comprador:
          oneOf:
            - type: string
            - type: object

        nome:
          type: string

        valor:
          type: number

        createdAt:
          type: string
          format: date-time

        updatedAt:
          type: string
          format: date-time

    ReviewInput:
      type: object
      required:
        - encomenda
        - classificacao

      properties:
        encomenda:
          type: string

        produto:
          type: string
          nullable: true

        classificacao:
          type: integer
          minimum: 1
          maximum: 5
          example: 5

        comentario:
          type: string
          example: Produto muito bom

    Review:
      type: object
      properties:
        _id:
          type: string

        autor:
          oneOf:
            - type: string
            - type: object

        produtor:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/Producer'

        produto:
          oneOf:
            - type: string
              nullable: true
            - $ref: '#/components/schemas/Product'

        encomenda:
          type: string

        classificacao:
          type: integer
          minimum: 1
          maximum: 5

        comentario:
          type: string

        denuncias:
          type: integer

        visivel:
          type: boolean

        createdAt:
          type: string
          format: date-time

        updatedAt:
          type: string
          format: date-time

    UserRole:
      type: string
      enum:
        - comprador
        - produtor
        - admin

    User:
      type: object
      properties:
        _id:
          type: string

        nome:
          type: string
          example: João Silva

        email:
          type: string
          format: email
          example: joao@exemplo.pt

        papel:
          $ref: '#/components/schemas/UserRole'

        produtor:
          type: object
          nullable: true
          properties:
            nomeExploracao:
              type: string

            descricao:
              type: string

            localidade:
              type: string

            localizacao:
              type: object
              description: Coordenadas geográficas do produtor, quando disponíveis
              properties:
                lat:
                  type: number
                  format: double
                lng:
                  type: number
                  format: double
                origem:
                  type: string
                  enum: [localidade, exploracao]

            validado:
              type: boolean

        createdAt:
          type: string
          format: date-time

    RegisterInput:
      type: object
      required:
        - nome
        - email
        - password
        - papel

      properties:
        nome:
          type: string
          example: João Silva

        email:
          type: string
          format: email
          example: joao@exemplo.pt

        password:
          type: string
          format: password
          minLength: 8
          example: password123

        papel:
          type: string
          enum:
            - comprador
            - produtor

        produtor:
          type: object
          properties:
            nomeExploracao:
              type: string

            descricao:
              type: string

            localidade:
              type: string

    LoginInput:
      type: object
      required:
        - email
        - password

      properties:
        email:
          type: string
          format: email
          example: tasca@exemplo.pt

        password:
          type: string
          format: password
          example: password123

    Session:
      type: object
      properties:
        token:
          type: string
          description: JWT utilizado nas rotas protegidas

        utilizador:
          $ref: '#/components/schemas/User'

    AdminStats:
      type: object
      properties:
        utilizadores:
          type: integer
          example: 4

        produtores:
          type: integer
          example: 2

        encomendasHoje:
          type: integer
          example: 1

        leiloesAtivos:
          type: integer
          example: 1